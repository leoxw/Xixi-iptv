name: 同步直播源

on:
  schedule:
    # 每 6 小时同步一次（UTC）
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 拉取最新频道并重新生成播放列表
        run: python3 update.py

      - name: 有变化时提交
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add playlist.m3u direct.m3u cntv.m3u channels.json
            git commit -m "自动同步直播源 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          else
            echo "频道没有变化，跳过提交。"
          fi  
